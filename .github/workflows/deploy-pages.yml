name: Deploy FINOVA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FINOVA-Smart-Expense-Tracker/package-lock.json
      - run: npm ci
        working-directory: FINOVA-Smart-Expense-Tracker
      - run: npm run build
        working-directory: FINOVA-Smart-Expense-Tracker
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: FINOVA-Smart-Expense-Tracker/dist
      - uses: actions/deploy-pages@v4
        id: deployment
